version: '3.8'

services:
  web:
    build: .
    container_name: notes-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:mypassword@db:5432/notes_db
      - SECRET_KEY=my-secret-key-12345
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: notes-postgres-compose
    environment:
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=notes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: